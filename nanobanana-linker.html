        * {

            left: 0;

    <script>
        // ===== IndexedDB Setup =====
        const DB_NAME = 'NanobananaLinkerDB';
        const DB_VERSION = 1;
        let db;

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);

                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };

                request.onupgradeneeded = (event) => {
                    const db = event.target.result;

                    // Characters Store
                    if (!db.objectStoreNames.contains('characters')) {
                        const characterStore = db.createObjectStore('characters', { keyPath: 'id', autoIncrement: true });
                        characterStore.createIndex('name', 'name', { unique: false });
                    }

                    // Settings Store
                    if (!db.objectStoreNames.contains('settings')) {
                        db.createObjectStore('settings', { keyPath: 'key' });
                    }
                };
            });
        }

        // ===== Database Operations =====
        function addCharacter(character) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['characters'], 'readwrite');
                const store = transaction.objectStore('characters');
                const request = store.add(character);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function updateCharacter(character) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['characters'], 'readwrite');
                const store = transaction.objectStore('characters');
                const request = store.put(character);

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function deleteCharacter(id) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['characters'], 'readwrite');
                const store = transaction.objectStore('characters');
                const request = store.delete(id);

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function getAllCharacters() {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['characters'], 'readonly');
                const store = transaction.objectStore('characters');
                const request = store.getAll();

                request.onsuccess = () => resolve(request.result);
                request.onerror = () => reject(request.error);
            });
        }

        function saveSetting(key, value) {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['settings'], 'readwrite');
                const store = transaction.objectStore('settings');
                const request = store.put({ key, value });

                request.onsuccess = () => resolve();
                request.onerror = () => reject(request.error);
            });
        }

        function getSetting(key, defaultValue = '') {
            return new Promise((resolve, reject) => {
                const transaction = db.transaction(['settings'], 'readonly');
                const store = transaction.objectStore('settings');
                const request = store.get(key);

                request.onsuccess = () => {
                    resolve(request.result ? request.result.value : defaultValue);
                };
                request.onerror = () => reject(request.error);
            });
        }

        // ===== UI State =====
        let currentTab = 'generator';
        let characterSlots = [null];
        let selectedImages = [];
        let editingCharacterId = null;

        // ===== Tab Navigation =====
        function switchTab(tabName) {
            currentTab = tabName;

            // Update tab buttons
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.tab === tabName);
            });

            // Update tab content
            document.querySelectorAll('.tab-content').forEach(content => {
                content.classList.add('hidden');
            });
            document.getElementById(`${tabName}-tab`).classList.remove('hidden');

            // Load data for specific tabs
            if (tabName === 'database') {
                loadCharacterList();
            } else if (tabName === 'settings') {
                loadSettings();
            }
        }

        // ===== Character Slots =====
        function renderCharacterSlots() {
            const container = document.getElementById('character-slots');
            container.innerHTML = '';

            characterSlots.forEach((character, index) => {
                const slot = document.createElement('div');
                slot.className = 'character-slot p-4 ' + (character ? 'active' : '');

                slot.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex-1">
                            <label class="block text-sm font-semibold text-gray-600 mb-2">スロット ${index + 1}</label>
                            <select class="character-select w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-blue-500" data-index="${index}">
                                <option value="">-- キャラクターを選択 --</option>
                            </select>
                        </div>
                        ${index > 0 ? `<button class="remove-slot ml-4 text-red-500 hover:text-red-700 text-xl" data-index="${index}">🗑️</button>` : ''}
                    </div>
                `;

                container.appendChild(slot);
            });

            // Populate select options
            getAllCharacters().then(characters => {
                document.querySelectorAll('.character-select').forEach((select, index) => {
                    characters.forEach(char => {
                        const option = document.createElement('option');
                        option.value = char.id;
                        option.textContent = char.name;
                        if (characterSlots[index] && characterSlots[index].id === char.id) {
                            option.selected = true;
                        }
                        select.appendChild(option);
                    });
                });
            });

            updateReferenceImages();
        }

        function addCharacterSlot() {
            if (characterSlots.length >= 10) {
                alert('最大10スロットまでです');
                return;
            }
            characterSlots.push(null);
            renderCharacterSlots();
        }

        function removeCharacterSlot(index) {
            characterSlots.splice(index, 1);
            renderCharacterSlots();
        }

        function selectCharacter(index, characterId) {
            if (!characterId) {
                characterSlots[index] = null;
                updateReferenceImages();
                return;
            }

            getAllCharacters().then(characters => {
                const character = characters.find(c => c.id === parseInt(characterId));
                characterSlots[index] = character || null;
                updateReferenceImages();
            });
        }

        function updateReferenceImages() {
            const container = document.getElementById('reference-images');
            const allImages = [];

            characterSlots.forEach(char => {
                if (char && char.images) {
                    allImages.push(...char.images.map(img => ({ char: char.name, data: img })));
                }
            });

            if (allImages.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-400 col-span-3 py-8">キャラを選択してください</div>';
                return;
            }

            container.innerHTML = allImages.slice(0, 10).map((img, index) => `
                <div class="relative group">
                    <img src="${img.data}" alt="${img.char}" class="image-preview" data-index="${index}">
                    <div class="absolute bottom-0 left-0 right-0 bg-black bg-opacity-70 text-white text-xs p-1 text-center opacity-0 group-hover:opacity-100 transition">
                        ${img.char}
                    </div>
                </div>
            `).join('');

            selectedImages = allImages;
        }

        // ===== Prompt Generation =====
        async function generatePrompt() {
            const includePositive = document.getElementById('quality-positive-toggle').checked;
            const includeNegative = document.getElementById('quality-negative-toggle').checked;

            const positivePreset = includePositive ? await getSetting('positivePreset', 'masterpiece, best quality, ultra detailed, 8k resolution') : '';
            const negativePreset = includeNegative ? await getSetting('negativePreset', 'low quality, worst quality, blurry, bad anatomy, watermark') : '';

            const characterPrompts = characterSlots
                .filter(char => char !== null)
                .map(char => `${char.trigger}, ${char.appearance}`)
                .join(', ');

            const positivePrompt = [positivePreset, characterPrompts]
                .filter(p => p.trim())
                .join(', ');

            const fullPrompt = negativePreset
                ? `${positivePrompt}\nNegative prompt: ${negativePreset}`
                : positivePrompt;

            return fullPrompt;
        }

        async function copyPrompt() {
            try {
                const prompt = await generatePrompt();

                if (!prompt.trim()) {
                    alert('プロンプトが空です。キャラクターを選択してください。');
                    return;
                }

                // Try clipboard API first
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(prompt);
                } else {
                    // Fallback for older browsers
                    const textarea = document.createElement('textarea');
                    textarea.value = prompt;
                    textarea.style.position = 'fixed';
                    textarea.style.opacity = '0';
                    document.body.appendChild(textarea);
                    textarea.select();
                    document.execCommand('copy');
                    document.body.removeChild(textarea);
                }

                const btn = document.getElementById('copy-prompt-btn');
                const originalText = btn.textContent;
                btn.textContent = '✅ コピーしました！';
                setTimeout(() => {
                    btn.textContent = originalText;
                }, 2000);

                // Show preview in console for debugging
                console.log('コピーされたプロンプト:', prompt);
            } catch (err) {
                console.error('コピーエラー:', err);
                alert('クリップボードへのコピーに失敗しました。\nエラー: ' + err.message + '\n\nHTTPS接続を使用しているか確認してください。');
            }
        }

        function saveImages() {
            if (selectedImages.length === 0) {
                alert('保存する画像がありません');
                return;
            }

            selectedImages.forEach((img, index) => {
                const link = document.createElement('a');
                link.href = img.data;
                link.download = `${img.char}_${index + 1}.png`;
                link.click();
            });
        }

        // ===== Character List =====
        async function loadCharacterList() {
            const characters = await getAllCharacters();
            const container = document.getElementById('character-list');

            if (characters.length === 0) {
                container.innerHTML = '<div class="col-span-full text-center text-gray-400 py-12">キャラクターが登録されていません</div>';
                return;
            }

            container.innerHTML = characters.map(char => `
                <div class="card p-4">
                    <div class="flex justify-between items-start mb-3">
                        <h3 class="font-bold text-lg text-gray-800">${char.name}</h3>
                        <div class="space-x-2">
                            <button class="edit-character text-blue-500 hover:text-blue-700" data-id="${char.id}">✏️</button>
                            <button class="delete-character text-red-500 hover:text-red-700" data-id="${char.id}">🗑️</button>
                        </div>
                    </div>
                    <p class="text-sm text-gray-600 mb-2"><strong>タグ:</strong> ${char.trigger}</p>
                    <p class="text-sm text-gray-600 mb-3 line-clamp-2">${char.appearance}</p>
                    ${char.images && char.images.length > 0 ? `
                        <div class="flex gap-2 overflow-x-auto">
                            ${char.images.slice(0, 3).map(img => `
                                <img src="${img}" alt="${char.name}" class="w-16 h-16 object-cover rounded">
                            `).join('')}
                            ${char.images.length > 3 ? `<div class="w-16 h-16 bg-gray-200 rounded flex items-center justify-center text-sm text-gray-600">+${char.images.length - 3}</div>` : ''}
                        </div>
                    ` : ''}
                </div>
            `).join('');
        }

        // ===== Character Form =====
        function openCharacterModal(characterId = null) {
            editingCharacterId = characterId;
            const modal = document.getElementById('character-modal');
            const form = document.getElementById('character-form');
            const title = document.getElementById('modal-title');

            if (characterId) {
                title.textContent = 'キャラクター編集';
                getAllCharacters().then(characters => {
                    const character = characters.find(c => c.id === characterId);
                    if (character) {
                        document.getElementById('character-id').value = character.id;
                        document.getElementById('character-name').value = character.name;
                        document.getElementById('character-trigger').value = character.trigger;
                        document.getElementById('character-appearance').value = character.appearance;

                        const previewContainer = document.getElementById('image-preview-container');
                        if (character.images && character.images.length > 0) {
                            previewContainer.innerHTML = character.images.map((img, index) => `
                                <div class="relative">
                                    <img src="${img}" class="w-full h-20 object-cover rounded">
                                    <button type="button" class="remove-preview-image absolute top-0 right-0 bg-red-500 text-white rounded-full w-6 h-6 text-xs" data-index="${index}">✕</button>
                                </div>
                            `).join('');
                        }
                    }
                });
            } else {
                title.textContent = 'キャラクター登録';
                form.reset();
                document.getElementById('character-id').value = '';
                document.getElementById('image-preview-container').innerHTML = '';
            }

            modal.classList.add('show');
        }

        function closeModal() {
            document.querySelectorAll('.modal').forEach(modal => {
                modal.classList.remove('show');
            });
            editingCharacterId = null;
        }

        async function handleImageSelection(files) {
            const previewContainer = document.getElementById('image-preview-container');
            const existingPreviews = previewContainer.querySelectorAll('img').length;

            for (let i = 0; i < files.length; i++) {
                if (existingPreviews + i >= 10) {
                    alert('画像は最大10枚まで登録できます');
                    break;
                }

                const file = files[i];
                const reader = new FileReader();

                reader.onload = (e) => {
                    const preview = document.createElement('div');
                    preview.className = 'relative';
                    preview.innerHTML = `
                        <img src="${e.target.result}" class="w-full h-20 object-cover rounded">
                        <button type="button" class="remove-preview-image absolute top-0 right-0 bg-red-500 text-white rounded-full w-6 h-6 text-xs">✕</button>
                    `;
                    previewContainer.appendChild(preview);
                };

                reader.readAsDataURL(file);
            }
        }

        async function saveCharacter(event) {
            event.preventDefault();

            const characterData = {
                name: document.getElementById('character-name').value,
                trigger: document.getElementById('character-trigger').value,
                appearance: document.getElementById('character-appearance').value,
                images: Array.from(document.getElementById('image-preview-container').querySelectorAll('img'))
                    .map(img => img.src)
            };

            if (editingCharacterId) {
                characterData.id = editingCharacterId;
                await updateCharacter(characterData);
            } else {
                await addCharacter(characterData);
            }

            closeModal();
            loadCharacterList();
            renderCharacterSlots();
        }

        async function deleteCharacterConfirm(id) {
            if (!confirm('このキャラクターを削除しますか？')) return;

            await deleteCharacter(id);
            loadCharacterList();
            renderCharacterSlots();
        }

        // ===== Settings =====
        async function loadSettings() {
            const positivePreset = await getSetting('positivePreset', 'masterpiece, best quality, ultra detailed, 8k resolution');
            const negativePreset = await getSetting('negativePreset', 'low quality, worst quality, blurry, bad anatomy, watermark');

            document.getElementById('positive-preset').value = positivePreset;
            document.getElementById('negative-preset').value = negativePreset;
        }

        async function saveSettings() {
            const positivePreset = document.getElementById('positive-preset').value;
            const negativePreset = document.getElementById('negative-preset').value;

            await saveSetting('positivePreset', positivePreset);
            await saveSetting('negativePreset', negativePreset);

            const btn = document.getElementById('save-presets-btn');
            const originalText = btn.textContent;
            btn.textContent = '✅ 保存しました！';
            setTimeout(() => {
                btn.textContent = originalText;
            }, 2000);
        }

        // ===== Import/Export =====
        async function exportJSON() {
            const characters = await getAllCharacters();
            const positivePreset = await getSetting('positivePreset', '');
            const negativePreset = await getSetting('negativePreset', '');

            const data = {
                version: 1,
                characters,
                settings: {
                    positivePreset,
                    negativePreset
                }
            };

            const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `nanobanana-backup-${Date.now()}.json`;
            link.click();
            URL.revokeObjectURL(url);
        }

        function importJSON() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = '.json';

            input.onchange = async (e) => {
                const file = e.target.files[0];
                if (!file) return;

                try {
                    const text = await file.text();
                    const data = JSON.parse(text);

                    if (!data.version || !data.characters) {
                        throw new Error('Invalid JSON format');
                    }

                    if (!confirm(`${data.characters.length}件のキャラクターをインポートします。よろしいですか？`)) {
                        return;
                    }

                    // Clear existing data
                    const characters = await getAllCharacters();
                    for (const char of characters) {
                        await deleteCharacter(char.id);
                    }

                    // Import characters
                    for (const char of data.characters) {
                        delete char.id; // Remove ID to create new entries
                        await addCharacter(char);
                    }

                    // Import settings
                    if (data.settings) {
                        await saveSetting('positivePreset', data.settings.positivePreset || '');
                        await saveSetting('negativePreset', data.settings.negativePreset || '');
                    }

                    alert('インポートが完了しました');
                    loadCharacterList();
                    renderCharacterSlots();
                } catch (err) {
                    alert('インポートに失敗しました: ' + err.message);
                }
            };

            input.click();
        }

        // ===== Event Listeners =====
        document.addEventListener('DOMContentLoaded', async () => {
            await initDB();

            // Tab navigation
            document.querySelectorAll('.tab-button').forEach(btn => {
                btn.addEventListener('click', () => switchTab(btn.dataset.tab));
            });

            // Generator Hub
            document.getElementById('add-slot-btn').addEventListener('click', addCharacterSlot);
            document.getElementById('copy-prompt-btn').addEventListener('click', copyPrompt);
            document.getElementById('save-images-btn').addEventListener('click', saveImages);

            document.getElementById('character-slots').addEventListener('change', (e) => {
                if (e.target.classList.contains('character-select')) {
                    selectCharacter(parseInt(e.target.dataset.index), e.target.value);
                }
            });

            document.getElementById('character-slots').addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-slot')) {
                    removeCharacterSlot(parseInt(e.target.dataset.index));
                }
            });

            document.getElementById('reference-images').addEventListener('click', (e) => {
                if (e.target.classList.contains('image-preview')) {
                    const index = parseInt(e.target.dataset.index);
                    const modal = document.getElementById('image-viewer-modal');
                    document.getElementById('viewer-image').src = selectedImages[index].data;
                    modal.classList.add('show');
                }
            });

            // Character DB
            document.getElementById('add-character-btn').addEventListener('click', () => openCharacterModal());
            document.getElementById('import-json-btn').addEventListener('click', importJSON);
            document.getElementById('export-json-btn').addEventListener('click', exportJSON);

            document.getElementById('character-list').addEventListener('click', (e) => {
                if (e.target.classList.contains('edit-character')) {
                    openCharacterModal(parseInt(e.target.dataset.id));
                } else if (e.target.classList.contains('delete-character')) {
                    deleteCharacterConfirm(parseInt(e.target.dataset.id));
                }
            });

            // Character Form
            document.getElementById('character-form').addEventListener('submit', saveCharacter);
            document.getElementById('character-images').addEventListener('change', (e) => {
                handleImageSelection(e.target.files);
            });

            document.getElementById('image-preview-container').addEventListener('click', (e) => {
                if (e.target.classList.contains('remove-preview-image')) {
                    e.target.parentElement.remove();
                }
            });

            // Settings
            document.getElementById('save-presets-btn').addEventListener('click', saveSettings);

            // Modal close
            document.querySelectorAll('.close-modal').forEach(btn => {
                btn.addEventListener('click', closeModal);
            });

            document.querySelectorAll('.modal').forEach(modal => {
                modal.addEventListener('click', (e) => {
                    if (e.target === modal) closeModal();
                });
            });

            // Initialize
            renderCharacterSlots();
            loadSettings();
        });

        // ===== PWA Service Worker =====
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                const swCode = `
                    self.addEventListener('install', (event) => {
                        self.skipWaiting();
                    });

                    self.addEventListener('activate', (event) => {
                        event.waitUntil(clients.claim());
                    });

                    self.addEventListener('fetch', (event) => {
                        event.respondWith(
                            caches.match(event.request).then((response) => {
                                return response || fetch(event.request);
                            })
                        );
                    });
                `;

                const blob = new Blob([swCode], { type: 'application/javascript' });
                const swUrl = URL.createObjectURL(blob);

                navigator.serviceWorker.register(swUrl).then(() => {
                    console.log('Service Worker registered');
                }).catch((err) => {
                    console.error('Service Worker registration failed:', err);
                });
            });
        }
    </script>
</body>
</html>
